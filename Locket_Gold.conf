#!name = Locket Gold By QuocCuong
#!desc = Mở khóa Locket Gold vĩnh viễn (RevenueCat + Firebase Remote Config)
#!author = quoccuong06
#!category = Tweak

[Script]
# 1. Xóa ETag để chống cache RevenueCat
Locket_ETag = type=http-request,pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/?(.*?)*$),script-path=https://raw.githubusercontent.com/nguyenquocc116-ship-it/ByGold/refs/heads/main/locket_2,max-size=0

# 2. Mở khóa gói Locket Gold qua RevenueCat
Locket_Sub = type=http-response,pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/?(.*?)*$),script-path=https://raw.githubusercontent.com/nguyenquocc116-ship-it/ByGold/refs/heads/main/Locket_1.js,requires-body=true,max-size=0

# 3. Mở khóa cấu hình từ xa (Quay video 1p, nén dung lượng, gỡ paywall, bộ lọc, huy hiệu...)
Locket_Config = type=http-response,pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-camera\/namespaces\/firebaseremoteconfig\/remoteConfig,script-path=https://raw.githubusercontent.com/nguyenquocc116-ship-it/ByGold/refs/heads/main/Locket_3.js,requires-body=true,max-size=0

[MITM]
hostname = %APPEND% api.revenuecat.com, firebaseremoteconfig.googleapis.com

